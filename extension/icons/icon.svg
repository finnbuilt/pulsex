<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Obsidian Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="2.5"/>

  <!-- Subtle Cyber Grid Accent -->
  <line x1="28" y1="64" x2="100" y2="64" stroke="#10b981" stroke-opacity="0.1" stroke-width="1" />
  <line x1="64" y1="28" x2="64" y2="100" stroke="#10b981" stroke-opacity="0.1" stroke-width="1" />

  <!-- Pulse Wave / 'X' Energy Line -->
  <path d="M 24 64 L 44 64 L 54 40 L 66 88 L 76 52 L 84 64 L 104 64" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#emeraldGlow)" />

  <!-- Glowing Nodes -->
  <circle cx="54" cy="40" r="3.5" fill="#34d399" />
  <circle cx="66" cy="88" r="3.5" fill="#06b6d4" />
  <circle cx="76" cy="52" r="3.5" fill="#10b981" />
</svg>
